AWSTemplateFormatVersion: "2010-09-09"
Description: Dedicated deployment role for the public-resume Pulumi stack

Parameters:
  TrustedPrincipalArn:
    Type: String
    Description: Exact IAM user or role ARN allowed to assume this deployment role
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:(user|role)/.+$"
  BucketName:
    Type: String
    Description: Exact S3 bucketName configured in the Pulumi stack
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  HostedZoneId:
    Type: String
    Description: Public Route 53 hosted zone ID for the root domain
    Default: Z28T3HGN0GB1AY

Resources:
  ResumeDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: public-resume-deployer
      Description: Deploys the public-resume Pulumi stack
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref TrustedPrincipalArn
            Action: sts:AssumeRole
      Policies:
        - PolicyName: public-resume-pulumi-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageResumeBucket
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:DeleteBucketPolicy
                  - s3:DeleteBucketPublicAccessBlock
                  - s3:DeleteBucketTagging
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:GetBucket*
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketVersions
                  - s3:ListBucketMultipartUploads
                  - s3:ListMultipartUploadParts
                  - s3:PutBucketPolicy
                  - s3:PutBucketPublicAccessBlock
                  - s3:PutBucketTagging
                  - s3:PutBucketVersioning
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::${BucketName}
                  - !Sub arn:${AWS::Partition}:s3:::${BucketName}/*
              - Sid: DiscoverHostedZone
                Effect: Allow
                Action:
                  - route53:GetHostedZone
                  - route53:ListHostedZonesByName
                  - route53:ListResourceRecordSets
                Resource: "*"
              - Sid: UpdateResumeDns
                Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                Resource: !Sub arn:${AWS::Partition}:route53:::hostedzone/${HostedZoneId}
              - Sid: ReadDnsChangeStatus
                Effect: Allow
                Action:
                  - route53:GetChange
                Resource: !Sub arn:${AWS::Partition}:route53:::change/*
              - Sid: RequestResumeCertificate
                Effect: Allow
                Action:
                  - acm:RequestCertificate
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: us-east-1
              - Sid: ManageResumeCertificate
                Effect: Allow
                Action:
                  - acm:AddTagsToCertificate
                  - acm:DeleteCertificate
                  - acm:DescribeCertificate
                  - acm:ListTagsForCertificate
                  - acm:RemoveTagsFromCertificate
                Resource: !Sub arn:${AWS::Partition}:acm:us-east-1:${AWS::AccountId}:certificate/*
              - Sid: CreateCloudFrontResources
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:ListDistributions
                  - cloudfront:ListOriginAccessControls
                Resource: "*"
              - Sid: ManageCloudFrontResources
                Effect: Allow
                Action:
                  - cloudfront:DeleteDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
              - Sid: ManageCloudFrontOriginAccessControls
                Effect: Allow
                Action:
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:UpdateOriginAccessControl
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*
              - Sid: TagCloudFrontResources
                Effect: Allow
                Action:
                  - cloudfront:ListTagsForResource
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
                  - !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:origin-access-control/*

Outputs:
  RoleArn:
    Description: ARN to set in the local AWS CLI role profile
    Value: !GetAtt ResumeDeploymentRole.Arn